{% extends "base.html" %}

{% block content %}
  <h1 style="text-align:center; margin-bottom:20px;">Pick a Vocab List</h1>
  
<div class="card-container">
  {% for vocab_list in lists %}
    <div class="vocab-card">
      
      <div class="vocab-card-content">
        <h3>{{ vocab_list.name }}</h3>
      </div>

      <div class="card-actions">
        
        <a href="{{ url_for('game', list_id=vocab_list.id) }}" class="card-btn btn-single">
          Singleplayer
        </a>

        <a href="http://172.16.8.139:5000/host/{{ vocab_list.id }}" class="card-btn btn-multi">
          Multiplayer
        </a>

      </div>
    </div>
  {% endfor %}
</div>

  {% if current_user.admin %}
  <p style="text-align:center; margin-top:30px;"><a href="/admin">Admin Panel</a></p>
  {% endif %}
{% endblock %}
